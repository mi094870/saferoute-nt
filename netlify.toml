[build]
publish = "."
functions = "netlify/functions"

[[redirects]]
from = "/__health.json"
to = "/.netlify/functions/health"
status = 200

[[redirects]]
from = "/__camera_lookup.json"
to = "/.netlify/functions/camera-lookup"
status = 200

[[redirects]]
from = "/__camera_snapshot"
to = "/.netlify/functions/camera-snapshot"
status = 200

[[headers]]
for = "/*"
  [headers.values]
  Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
for = "/vendor/*"
  [headers.values]
  Cache-Control = "public, max-age=86400"

[[headers]]
for = "/manifest.webmanifest"
  [headers.values]
  Content-Type = "application/manifest+json; charset=utf-8"
  Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
for = "/service-worker.js"
  [headers.values]
  Content-Type = "application/javascript; charset=utf-8"
  Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
for = "/assets/icons/*"
  [headers.values]
  Cache-Control = "public, max-age=86400"
